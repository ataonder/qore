[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "qore"
version = "0.1.0"
description = "A ligthweight quantum computing library built from scratch with Python"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

authors = [
    { name = "Ata" }
]

dependencies = [
    "numpy>=2.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]